packages:
  - "apps/*"
  - "packages/*"

overrides:
  fast-uri: ">=3.1.2"
  fast-xml-builder: ">=1.1.7"
  fast-xml-parser: ">=5.7.2"
  "zod@^4.0.0": "4.4.3"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true

# Project settings (migrated from .npmrc — pnpm 11 ignores .npmrc for project config)
autoInstallPeers: true

catalog:
  # ── Runtime (shared across 2+ apps) ──────────────────────────
  motion: "^12.23.0"
  jose: "^5.10.0"
  next: "16.2.6"
  react: "19.2.5"
  react-dom: "19.2.5"
  zod: "^3.25.67"
  lucide-react: "^0.525.0"
  tailwind-merge: "^3.3.1"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  qrcode: "^1.5.4"
  "@radix-ui/react-dialog": "^1.1.15"
  tw-animate-css: "^1.3.4"

  # ── Dev tooling (shared across 2+ apps) ──────────────────────
  typescript: "^5.8.3"
  vitest: "^4.1.4"
  tailwindcss: "4.1.11"
  "@tailwindcss/postcss": "4.1.11"
  "@types/node": "22.14.0"
  "@types/react": "^19.1.8"
  "@types/react-dom": "^19.1.6"
  "@types/qrcode": "^1.5.5"

