packages:
  - "apps/*"
  - "packages/*"

overrides:
  fast-uri: ">=3.1.2"
  fast-xml-builder: ">=1.2.0"
  fast-xml-parser: ">=5.8.0"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true

# Project settings (migrated from .npmrc — pnpm 11 ignores .npmrc for project config)
autoInstallPeers: true
# Disable pnpm's built-in minimumReleaseAge check — Renovate's own
# minimumReleaseAge (3 days) already gates dependency freshness.
minimumReleaseAge: 0

catalog:
  # ── Runtime (shared across 2+ apps) ──────────────────────────
  motion: "^12.40.0"
  jose: "^5.10.0"
  next: "16.2.7"
  react: "19.2.7"
  react-dom: "19.2.7"
  zod: "^4.4.3"
  lucide-react: "^0.577.0"
  tailwind-merge: "^3.6.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  qrcode: "^1.5.4"
  "@radix-ui/react-dialog": "^1.1.15"
  tw-animate-css: "^1.4.0"

  # ── Dev tooling (shared across 2+ apps) ──────────────────────
  typescript: "^5.9.3"
  vitest: "^4.1.8"
  tailwindcss: "4.3.0"
  "@tailwindcss/postcss": "4.3.0"
  "@types/node": "22.19.19"
  "@types/react": "19.1.8"
  "@types/react-dom": "19.2.3"
  "@types/qrcode": "1.5.6"
