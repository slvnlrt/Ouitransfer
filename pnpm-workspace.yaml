packages:
  - "apps/*"
  - "packages/*"

overrides:
  fast-uri: ">=3.1.2"
  fast-xml-builder: ">=1.2.0"
  fast-xml-parser: ">=5.8.0"
  "zod@^4.0.0": "4.4.3"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true

# Project settings (migrated from .npmrc — pnpm 11 ignores .npmrc for project config)
autoInstallPeers: true
# Disable pnpm's built-in minimumReleaseAge check — Renovate's own
# minimumReleaseAge (3 days) already gates dependency freshness.
minimumReleaseAge: 0
# Disable pnpm 11's automatic dependency sync check before pnpm exec/run.
# The default ('install') causes pnpm to run `pnpm install` implicitly when any
# workspace member's node_modules are missing — which happens in Docker builds
# where only the target package's deps are installed. That implicit install runs
# lifecycle scripts (prepare → lefthook install) which fail without a git repo.
verifyDepsBeforeRun: false

catalog:
  # ── Runtime (shared across 2+ apps) ──────────────────────────
  motion: "^12.40.0"
  jose: "^5.10.0"
  next: "16.2.6"
  react: "19.2.6"
  react-dom: "19.2.6"
  zod: "^3.25.76"
  lucide-react: "^0.577.0"
  tailwind-merge: "^3.6.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  qrcode: "^1.5.4"
  "@radix-ui/react-dialog": "^1.1.15"
  tw-animate-css: "^1.4.0"

  # ── Dev tooling (shared across 2+ apps) ──────────────────────
  typescript: "^5.9.3"
  vitest: "^4.1.7"
  tailwindcss: "4.3.0"
  "@tailwindcss/postcss": "4.3.0"
  "@types/node": "22.19.19"
  "@types/react": "^19.1.8"
  "@types/react-dom": "^19.2.3"
  "@types/qrcode": "^1.5.5"
