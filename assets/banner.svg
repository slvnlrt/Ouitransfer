<svg width="1280" height="300" viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="300" fill="#09090b"/>

  <!-- Glow -->
  <ellipse cx="640" cy="150" rx="560" ry="200" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="2" fill="#4f46e5" opacity="0.7"/>

  <!-- Upload icon — centered at (640, 82), 44×44 px (lucide Upload, stroke only) -->
  <g transform="translate(618, 60) scale(1.83)" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </g>

  <!-- Title -->
  <text
    x="640" y="168"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="66"
    font-weight="700"
    fill="#fafafa"
    text-anchor="middle"
    letter-spacing="-1.5"
  >Ouitransfer</text>

  <!-- Subtitle -->
  <text
    x="640" y="212"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="21"
    fill="#71717a"
    text-anchor="middle"
  >The open-source, self-hosted alternative to WeTransfer</text>

  <!-- Tags -->
  <text
    x="640" y="255"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13"
    fill="#4f46e5"
    text-anchor="middle"
    letter-spacing="3"
  >SELF-HOSTED  ·  OPEN SOURCE  ·  ZERO TRACKING</text>

  <!-- Bottom accent line -->
  <rect x="0" y="298" width="1280" height="2" fill="#4f46e5" opacity="0.7"/>
</svg>
