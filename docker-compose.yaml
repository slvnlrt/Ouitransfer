# ==============================================================================
# Ouitransfer — Docker Compose
#
# Services:
#   storage  — RustFS (S3-compatible object storage)   :9000
#   server   — Fastify API                              :3333
#   web      — Next.js frontend                         :5487
#   docs     — Fumadocs documentation site (path /docs) :5488
#
# ── Deployment mode A: direct ports (this file, out of the box) ──
# Each service is published on a host port. Good for local use or a simple
# self-host without a reverse proxy.
#   docker compose up -d              ← works with localhost defaults
#   # production: copy .env.docker.example to .env, set real secrets/origins, then
#   docker compose up -d
#   # open http://YOUR_SERVER_IP:5487   (docs at http://YOUR_SERVER_IP:5488/docs)
#
# ── Deployment mode B: behind a reverse proxy (Traefik) ──
# Recommended for internet-facing / HTTPS deployments: one hostname, TLS
# termination, no host ports. See the fully commented example at the bottom of
# this file ("PRODUCTION EXAMPLE — reverse proxy").
#
# All user-configurable values use ${VAR:-default} syntax. Defaults are localhost
# values suitable for local development; override them via a .env file.
#
# Startup order: storage → server → web (via healthcheck dependencies)
# ==============================================================================

services:
  # ─── S3-Compatible Object Storage ──────────────────────────────────────────
  storage:
    image: rustfs/rustfs:latest
    container_name: ouitransfer-storage
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:-ouitransfer}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:-ouitransfer}"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5487}"
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"    # S3 API — must be reachable by browsers for file uploads
      # - "9001:9001"  # Storage console (optional, for debugging)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  # ─── Fastify API Server ────────────────────────────────────────────────────
  server:
    image: ghcr.io/slvnlrt/ouitransfer-server:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: server-runner
    container_name: ouitransfer-server
    environment:
      # ── Storage connection ──
      S3_ENDPOINT: storage
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ouitransfer}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-ouitransfer}"
      S3_BUCKET_NAME: ouitransfer-files
      S3_REGION: auto
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_URL: "${STORAGE_PUBLIC_URL:-http://localhost:9000}"

      # ── Security ──
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production!!}"
      CSRF_SECRET: "${CSRF_SECRET:-dev-csrf-secret-do-not-use-in-production!}"
      COOKIE_SECRET: "${COOKIE_SECRET:-dev-cookie-secret-not-for-production!}"
      # Comma-separated allow-list. Must include EVERY hostname the app is
      # served on — if you expose it on several hosts (e.g. an external domain
      # and an internal .lan host), set FRONTEND_ORIGIN to a comma-separated
      # list. An unlisted-but-reachable origin gets a 403 (breaks login first).
      CORS_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5487}"

      # ── Optional settings ──
      # OUITRANSFER_UID: "1000"              # UID for server process
      # OUITRANSFER_GID: "1000"              # GID for server process
      # SECURE_SITE: "true"                  # Set true when behind HTTPS reverse proxy
      # PRESIGNED_URL_EXPIRATION: "3600"     # Upload URL expiration (seconds)
      # PRESIGNED_GET_URL_EXPIRATION: "900"  # Download URL expiration (seconds)
      # ENCRYPTION_SECRET: ""               # Required for LDAP — generate with: openssl rand -hex 32
      #
      # ── External S3 (instead of bundled storage) ──
      # To use AWS S3, Backblaze B2, etc. instead of the storage service:
      # 1. Remove or stop the 'storage' service
      # 2. Set ENABLE_S3=true
      # 3. Update S3_* vars with your provider's credentials
      # 4. Remove STORAGE_PUBLIC_URL (not needed for external S3)
      # ENABLE_S3: "true"
    volumes:
      - server_data:/app/server
    ports:
      - "3333:3333"    # API (optional: only needed for direct API access)
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─── Next.js Web Frontend ──────────────────────────────────────────────────
  web:
    image: ghcr.io/slvnlrt/ouitransfer-web:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: web-runner
    container_name: ouitransfer-web
    environment:
      API_BASE_URL: "http://server:3333"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production!!}"
      CSP_STORAGE_ORIGINS: "${STORAGE_PUBLIC_URL:-http://localhost:9000}"
      # DEFAULT_LANGUAGE: "en-US"
    ports:
      - "5487:5487"    # Web interface
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ─── Fumadocs Documentation Site ───────────────────────────────────────────
  # Self-contained Next.js site, mounted under /docs (basePath baked into the
  # image at build time, default "/docs"). Reachable directly at
  # http://YOUR_SERVER_IP:5488/docs. Behind a reverse proxy, route /docs to this
  # service WITHOUT stripping the prefix (basePath already keeps it) — see the
  # "PRODUCTION EXAMPLE" section at the bottom of this file.
  docs:
    image: ghcr.io/slvnlrt/ouitransfer-docs:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: docs-runner
    container_name: ouitransfer-docs
    ports:
      - "5488:5488"    # Documentation site (path: /docs)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5488/docs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  storage_data:
  server_data:

# ==============================================================================
# PRODUCTION EXAMPLE — reverse proxy (Traefik)
# ==============================================================================
# A complete, internet-facing setup behind Traefik on a single hostname
# (https://files.example.com). Differences from the direct-port config above:
#
#   • No published host ports — all traffic enters through Traefik.
#   • Services join an existing external Traefik network.
#   • Routing by Traefik labels (more specific prefixes win via higher priority):
#       /api               → server  (:3333) ← StripPrefix(/api), see note below
#       /docs              → docs    (:5488) ← basePath kept, no strip
#       /ouitransfer-files → storage (:9000) ← S3 bucket path, browsers upload here
#       /  (catch-all)     → web     (:5487)
#     Traefik intercepts /api directly so API traffic (incl. large uploads) never
#     transits the Next.js container. The web container's built-in /api rewrite is
#     only a fallback for the direct-port / no-proxy mode.
#   • StripPrefix(/api): Fastify currently registers routes at the root (e.g.
#     POST /shares), so /api is stripped before reaching it. Once TD-27 lands
#     (Fastify owns the /api prefix natively) this middleware can be dropped and a
#     plain PathPrefix(`/api`) is enough.
#   • TRUST_PROXY=true on the server so it reads the real client IP and the
#     forwarded host/proto (rate limiting, OAuth redirects) from Traefik.
#   • Persistent data on host bind-mounts instead of named volumes.
#   • Memory limits via deploy.resources.
#   • HTTPS, so SECURE_SITE=true and all origins use https://.
#
# Suggested .env for this example:
#   APP_HOST=files.example.com
#   FRONTEND_ORIGIN=https://files.example.com
#     ↳ Served on several hostnames? List them all, comma-separated, e.g.
#       FRONTEND_ORIGIN=https://files.example.com,https://files.internal.lan
#       (feeds both CORS_ORIGINS on the API and RUSTFS_CORS_ALLOWED_ORIGINS on
#        storage; an unlisted-but-reachable origin gets a 403 — login breaks first).
#   STORAGE_PUBLIC_URL=https://files.example.com/ouitransfer-files
#   S3_ACCESS_KEY=...           S3_SECRET_KEY=...            # openssl rand -hex 32
#   JWT_SECRET=...   CSRF_SECRET=...   COOKIE_SECRET=...     # 3 distinct secrets
#   STORAGE_DATA_PATH=/srv/ouitransfer/storage
#   SERVER_DATA_PATH=/srv/ouitransfer/server
#
# Copy this into your own compose file and adapt. Save it as docker-compose.yml
# (it is self-contained — it replaces, not overlays, the services above).
