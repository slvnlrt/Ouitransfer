# ==============================================================================
# Ouitransfer — Docker Compose (3-container architecture)
#
# Services:
#   storage  — RustFS (S3-compatible object storage)
#   server   — Fastify API
#   web      — Next.js frontend
#
# Quick start:
#   1. Set the required values below (marked REQUIRED)
#   2. Run: docker compose up -d
#   3. Open http://localhost:5487
#
# Startup order: storage → server → web (via healthcheck dependencies)
# ==============================================================================

services:
  # ─── S3-Compatible Object Storage ──────────────────────────────────────────
  storage:
    image: rustfs/rustfs:latest
    container_name: ouitransfer-storage
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ""    # REQUIRED: set your storage access key
      RUSTFS_SECRET_KEY: ""    # REQUIRED: set your storage secret key
      RUSTFS_CONSOLE_ENABLE: "true"
      # REQUIRED: Allow browsers to upload/download files directly via presigned URLs.
      # Set to the web frontend origin(s). Comma-separated for multiple origins.
      # Must match the origin users access the web interface from.
      # Examples: http://localhost:5487, https://files.example.com
      RUSTFS_CORS_ALLOWED_ORIGINS: ""    # REQUIRED: e.g., http://localhost:5487
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"    # S3 API — must be reachable by browsers for file uploads (when using internal storage)
      # - "9001:9001"  # Storage console (optional, for debugging)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  # ─── Fastify API Server ────────────────────────────────────────────────────
  server:
    image: ghcr.io/slvnlrt/ouitransfer-server:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: server-runner
    container_name: ouitransfer-server
    environment:
      # ── Storage connection (must match storage service credentials) ──
      S3_ENDPOINT: storage
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ""                                # Must match RUSTFS_ACCESS_KEY
      S3_SECRET_KEY: ""                                # Must match RUSTFS_SECRET_KEY
      S3_BUCKET_NAME: ouitransfer-files
      S3_REGION: auto
      S3_FORCE_PATH_STYLE: "true"

      # REQUIRED: Public URL where browsers can reach the storage service.
      # Include protocol. The port must match the storage service's published port.
      # Examples:
      #   http://localhost:9000           (local development)
      #   http://192.168.1.100:9000      (LAN access)
      #   https://storage.example.com    (production with reverse proxy)
      # WARNING: Use HTTPS in production. HTTP exposes presigned URL signatures
      # and file contents on the wire. Browsers block mixed-content requests
      # if the web app is served over HTTPS but storage uses HTTP.
      STORAGE_URL: ""    # REQUIRED: public URL where browsers reach storage (e.g., http://192.168.1.100:9000)

      # REQUIRED: Security secrets — generate each with: openssl rand -hex 32
      # All three MUST be different from each other.
      JWT_SECRET: ""       # REQUIRED: generate with: openssl rand -hex 32
      CSRF_SECRET: ""      # REQUIRED: generate with: openssl rand -hex 32
      COOKIE_SECRET: ""    # REQUIRED: generate with: openssl rand -hex 32

      # REQUIRED: Comma-separated list of origins allowed to make cross-origin requests.
      # Must include the URL(s) users access the web interface from.
      # Examples:
      #   http://localhost:5487           (local single-host setup)
      #   http://192.168.1.100:5487      (LAN access)
      #   https://files.example.com      (production with reverse proxy)
      CORS_ORIGINS: ""     # REQUIRED: e.g., http://localhost:5487

      #
      # ── Optional settings ──
      # OUITRANSFER_UID: "1000"              # UID for server process
      # OUITRANSFER_GID: "1000"              # GID for server process
      # SECURE_SITE: "true"                  # Set true when behind HTTPS reverse proxy
      # PRESIGNED_URL_EXPIRATION: "3600"     # Upload URL expiration (seconds)
      # PRESIGNED_GET_URL_EXPIRATION: "900"  # Download URL expiration (seconds)
      #
      # ── External S3 (instead of bundled storage) ──
      # To use AWS S3, Backblaze B2, etc. instead of the storage service:
      # 1. Remove or stop the 'storage' service
      # 2. Set ENABLE_S3=true
      # 3. Update S3_* vars with your provider's credentials
      # 4. Remove STORAGE_URL (not needed for external S3)
      # ENABLE_S3: "true"
    volumes:
      - server_data:/app/server
    ports:
      - "3333:3333"    # API (optional: only needed for direct API access)
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─── Next.js Web Frontend ──────────────────────────────────────────────────
  web:
    image: ghcr.io/slvnlrt/ouitransfer-web:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: web-runner
    container_name: ouitransfer-web
    environment:
      API_BASE_URL: "http://server:3333"
      JWT_SECRET: ""       # REQUIRED: must match server's JWT_SECRET (used by middleware for auth)

      # REQUIRED: Must match the server's STORAGE_URL value.
      # Browsers upload files directly to this storage endpoint via presigned URLs;
      # this value is added to the Content-Security-Policy connect-src and img-src directives.
      CSP_STORAGE_ORIGINS: ""    # REQUIRED: same value as server's STORAGE_URL (e.g., http://192.168.1.100:9000)

      # DEFAULT_LANGUAGE: "en-US"
    ports:
      - "5487:5487"    # Web interface
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage_data:
  server_data:
