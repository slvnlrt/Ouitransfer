# ==============================================================================
# Ouitransfer — Docker Compose
#
# Services:
#   storage  — RustFS (S3-compatible object storage)   :9000
#   server   — Fastify API                              :3333
#   web      — Next.js frontend                         :5487
#   docs     — Fumadocs documentation site (path /docs) :5488
#
# ── Deployment mode A: direct ports (this file, out of the box) ──
# Each service is published on a host port. Good for local use or a simple
# self-host without a reverse proxy.
#   docker compose up -d              ← works with localhost defaults
#   # production: copy .env.docker.example to .env, set real secrets/origins, then
#   docker compose up -d
#   # open http://YOUR_SERVER_IP:5487   (docs at http://YOUR_SERVER_IP:5488/docs)
#
# ── Deployment mode B: behind a reverse proxy (Traefik) ──
# Recommended for internet-facing / HTTPS deployments: one hostname, TLS
# termination, no host ports. See the fully commented example at the bottom of
# this file ("PRODUCTION EXAMPLE — reverse proxy").
#
# Secrets and credentials are REQUIRED — Compose fails fast (`${VAR:?...}`) if they
# are unset. There are intentionally NO weak built-in defaults for secrets (a prior
# version shipped `dev-*` placeholders that silently booted a public-key stack —
# CVE-class A8-01). Copy `.env.docker.example` to `.env` and generate each secret
# with `openssl rand -hex 32` before the first `docker compose up`.
#
# Non-secret, host-specific values use ${VAR:-default} with localhost defaults.
#
# Startup order: storage → server → web (via healthcheck dependencies)
# ==============================================================================

services:
  # ─── S3-Compatible Object Storage ──────────────────────────────────────────
  storage:
    # Using the rolling `latest` tag. For reproducible / supply-chain-hardened
    # deployments, pin to an immutable version tag or digest
    # (rustfs/rustfs@sha256:...) and let Renovate bump it (cf. audit A8-10).
    image: rustfs/rustfs:latest
    container_name: ouitransfer-storage
    environment:
      RUSTFS_VOLUMES: /data
      # A8-01/A8-03: required, no fallback. Same value the server uses.
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      # A8-03: admin console OFF by default — it exposed object-store management
      # to anyone who could reach the host. Enable only for local debugging.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5487}"
    volumes:
      - storage_data:/data
    ports:
      # The S3 API must be browser-reachable for presigned uploads. This default
      # (local + LAN) compose publishes it on all interfaces so browsers on other
      # machines can upload directly. On an INTERNET-FACING deployment, do NOT
      # expose :9000 directly (object storage behind it is a data-breach surface) —
      # serve it through a reverse-proxied bucket path and bind to 127.0.0.1
      # instead (see the Traefik example at the bottom of this file).
      - "9000:9000"              # S3 API — exposed for direct browser uploads (reverse-proxy + 127.0.0.1 for internet-facing)
      # - "9001:9001"            # Storage console (only if RUSTFS_CONSOLE_ENABLE=true)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # A8-09: container hardening.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    restart: unless-stopped

  # ─── Fastify API Server ────────────────────────────────────────────────────
  server:
    # Rolling `latest` tag. Pin to a version/digest for reproducible deploys (A8-10).
    image: ghcr.io/slvnlrt/ouitransfer-server:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: server-runner
    container_name: ouitransfer-server
    environment:
      # ── Storage connection ──
      S3_ENDPOINT: storage
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      # A8-01/A8-03: required, no fallback (must match the storage service).
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET_NAME: ouitransfer-files
      S3_REGION: auto
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_URL: "${STORAGE_PUBLIC_URL:-http://localhost:9000}"

      # ── Security ──
      # A8-01: REQUIRED, no fallback. Generate each with `openssl rand -hex 32`;
      # all four must be distinct. There are deliberately NO `dev-*` defaults —
      # Compose fails fast if any is unset, and env.ts refuses to boot in
      # production on a known placeholder or low-entropy value.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      CSRF_SECRET: "${CSRF_SECRET:?CSRF_SECRET is required}"
      COOKIE_SECRET: "${COOKIE_SECRET:?COOKIE_SECRET is required}"
      # ENCRYPTION_SECRET is now REQUIRED (R3a): master key for encrypting the 2FA
      # TOTP secret and LDAP bind password at rest. Distinct from the three above.
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}"
      # Comma-separated allow-list. Must include EVERY hostname the app is
      # served on — if you expose it on several hosts (e.g. an external domain
      # and an internal .lan host), set FRONTEND_ORIGIN to a comma-separated
      # list. An unlisted-but-reachable origin gets a 403 (breaks login first).
      CORS_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5487}"

      # ── Optional settings ──
      # OUITRANSFER_UID: "1000"              # UID for server process
      # OUITRANSFER_GID: "1000"              # GID for server process
      # SECURE_SITE: "true"                  # Set true when behind HTTPS reverse proxy
      # PRESIGNED_URL_EXPIRATION: "3600"     # Upload URL expiration (seconds)
      # PRESIGNED_GET_URL_EXPIRATION: "900"  # Download URL expiration (seconds)
      #
      # ── trustProxy (A8-08) ──
      # The default file publishes the API on a host port (3333) below. Do NOT
      # set a permissive TRUST_PROXY here: with the port directly reachable, a
      # client connecting directly with a forged X-Forwarded-For would control
      # request.ip and bypass per-route rate limits. Leave TRUST_PROXY unset
      # (defaults to "loopback"). TRUST_PROXY=true (or a proxy CIDR) is ONLY safe
      # when the server has NO direct host port (reverse-proxy mode — see the
      # Traefik example, which drops the 3333 port). Prefer a specific CIDR over
      # "true": e.g. TRUST_PROXY=172.18.0.0/16 (your proxy's docker network).
      #
      # ── Self-hosted SSRF opt-ins (default OFF; document, leave commented) ──
      # S3_ALLOW_PRIVATE_ENDPOINT: "false"   # allow S3_ENDPOINT/STORAGE_URL on a private/loopback host
      # STORAGE_ALLOWED_HOSTS: ""            # comma-separated exact-host allowlist for storage
      # OAUTH_ALLOW_PRIVATE_ENDPOINT: "false"  # allow OIDC discovery/token/userinfo on a private host
      # OAUTH_ALLOWED_ENDPOINT_HOSTS: ""     # comma-separated exact-host allowlist for the IdP
      # LDAP_ALLOWED_HOSTS: ""               # optional comma-separated exact-host lockdown for LDAP (unset = any host except cloud metadata)
      #
      # ── External S3 (instead of bundled storage) ──
      # To use AWS S3, Backblaze B2, etc. instead of the storage service:
      # 1. Remove or stop the 'storage' service
      # 2. Set ENABLE_S3=true
      # 3. Update S3_* vars with your provider's credentials
      # 4. Remove STORAGE_PUBLIC_URL (not needed for external S3)
      # ENABLE_S3: "true"
    volumes:
      - server_data:/app/server
    ports:
      # A8-08: direct API port. Paired with the default (loopback) TRUST_PROXY
      # above — do not loosen trustProxy while this port is published.
      - "3333:3333"    # API (optional: only needed for direct API access)
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # A8-09: container hardening. The image runs as the non-root `ouitransfer`
    # user (USER in the Dockerfile server-runner stage) and the named volume is
    # pre-owned, so no root window. `read_only` is omitted here because the app
    # writes to the SQLite DB + uploads under the mounted /app/server volume; the
    # rest of the rootfs is effectively read-only via the immutable image layers.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    restart: unless-stopped

  # ─── Next.js Web Frontend ──────────────────────────────────────────────────
  web:
    # A8-10: pinned tag (Renovate-managed).
    image: ghcr.io/slvnlrt/ouitransfer-web:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: web-runner
    container_name: ouitransfer-web
    environment:
      API_BASE_URL: "http://server:3333"
      # A8-01: required, no fallback (must match the server's JWT_SECRET — the web
      # tier verifies the same signed token for SSR auth).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      CSP_STORAGE_ORIGINS: "${STORAGE_PUBLIC_URL:-http://localhost:9000}"
      # Canonical public origin for OpenGraph/canonical metadata on public share
      # pages. The web tier uses APP_URL if set, otherwise the FIRST entry of
      # FRONTEND_ORIGIN (the primary public origin) — so this works out of the box.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5487}"
      # APP_URL (optional override): set only if the canonical origin differs from
      # the first FRONTEND_ORIGIN entry, e.g. https://files.example.com.
      # APP_URL: "https://files.example.com"
      # DEFAULT_LANGUAGE: "en-US"
    ports:
      - "5487:5487"    # Web interface
    depends_on:
      server:
        condition: service_healthy
    # A8-09: container hardening. The web image already runs as non-root (USER
    # nextjs). Next.js standalone needs to write its on-disk cache, so we make the
    # rootfs read-only and provide tmpfs for the writable paths.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    restart: unless-stopped

  # ─── Fumadocs Documentation Site ───────────────────────────────────────────
  # Self-contained Next.js site, mounted under /docs (basePath baked into the
  # image at build time, default "/docs"). Reachable directly at
  # http://YOUR_SERVER_IP:5488/docs. Behind a reverse proxy, route /docs to this
  # service WITHOUT stripping the prefix (basePath already keeps it) — see the
  # "PRODUCTION EXAMPLE" section at the bottom of this file.
  docs:
    # A8-10: pinned tag (Renovate-managed).
    image: ghcr.io/slvnlrt/ouitransfer-docs:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   target: docs-runner
    container_name: ouitransfer-docs
    ports:
      - "5488:5488"    # Documentation site (path: /docs)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5488/docs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # A8-09: container hardening. Runs as non-root (USER nextjs). Read-only rootfs
    # with tmpfs for the Next.js cache + /tmp.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/docs/.next/cache
    restart: unless-stopped

volumes:
  storage_data:
  server_data:

# ==============================================================================
# PRODUCTION EXAMPLE — reverse proxy (Traefik)
# ==============================================================================
# A complete, internet-facing setup behind Traefik on a single hostname
# (https://files.example.com). Differences from the direct-port config above:
#
#   • No published host ports — all traffic enters through Traefik.
#   • Services join an existing external Traefik network.
#   • Routing by Traefik labels (more specific prefixes win via higher priority):
#       /api               → server  (:3333) ← StripPrefix(/api), see note below
#       /docs              → docs    (:5488) ← basePath kept, no strip
#       /ouitransfer-files → storage (:9000) ← S3 bucket path, browsers upload here
#       /  (catch-all)     → web     (:5487)
#     Traefik intercepts /api directly so API traffic (incl. large uploads) never
#     transits the Next.js container. The web container's built-in /api rewrite is
#     only a fallback for the direct-port / no-proxy mode.
#   • StripPrefix(/api): Fastify currently registers routes at the root (e.g.
#     POST /shares), so /api is stripped before reaching it. Once TD-27 lands
#     (Fastify owns the /api prefix natively) this middleware can be dropped and a
#     plain PathPrefix(`/api`) is enough.
#   • TRUST_PROXY=true on the server so it reads the real client IP and the
#     forwarded host/proto (rate limiting, OAuth redirects) from Traefik.
#   • Persistent data on host bind-mounts instead of named volumes.
#   • Memory limits via deploy.resources.
#   • HTTPS, so SECURE_SITE=true and all origins use https://.
#
# Suggested .env for this example:
#   APP_HOST=files.example.com
#   FRONTEND_ORIGIN=https://files.example.com
#     ↳ Served on several hostnames? List them all, comma-separated, e.g.
#       FRONTEND_ORIGIN=https://files.example.com,https://files.internal.lan
#       (feeds both CORS_ORIGINS on the API and RUSTFS_CORS_ALLOWED_ORIGINS on
#        storage; an unlisted-but-reachable origin gets a 403 — login breaks first).
#   STORAGE_PUBLIC_URL=https://files.example.com/ouitransfer-files
#   S3_ACCESS_KEY=...           S3_SECRET_KEY=...            # openssl rand -hex 32
#   JWT_SECRET=...  CSRF_SECRET=...  COOKIE_SECRET=...  ENCRYPTION_SECRET=...  # 4 distinct secrets
#   STORAGE_DATA_PATH=/srv/ouitransfer/storage
#   SERVER_DATA_PATH=/srv/ouitransfer/server
#
# Copy this into your own compose file and adapt. Save it as docker-compose.yml
# (it is self-contained — it replaces, not overlays, the services above).
