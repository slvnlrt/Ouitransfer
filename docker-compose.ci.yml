# ==============================================================================
# CI overlay — build images locally and inject test credentials.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --build
#   docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v
#
# Values here OVERRIDE the empty-string placeholders in docker-compose.yaml.
# Docker Compose merges environment maps — keys in the override file win.
# ==============================================================================

services:
  storage:
    environment:
      RUSTFS_ACCESS_KEY: ci-test-access-key
      RUSTFS_SECRET_KEY: ci-test-secret-key
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5487"

  server:
    build:
      context: .
      target: server-runner
    environment:
      S3_ACCESS_KEY: ci-test-access-key
      S3_SECRET_KEY: ci-test-secret-key
      STORAGE_URL: "http://localhost:9000"
      JWT_SECRET: ci-e2e-jwt-secret-minimum-32-characters-long-ok
      CSRF_SECRET: ci-e2e-csrf-secret-minimum-32-characters-long-ok
      COOKIE_SECRET: ci-e2e-cookie-secret-minimum-32-characters-long-ok
      CORS_ORIGINS: "http://localhost:5487"

  web:
    build:
      context: .
      target: web-runner
      args:
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
    environment:
      JWT_SECRET: ci-e2e-jwt-secret-minimum-32-characters-long-ok
      CSP_STORAGE_ORIGINS: "http://localhost:9000"
