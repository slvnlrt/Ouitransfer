name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Security Audit
        # Transitive vulnerabilities may cause failures until upstream patches.
        # Non-blocking: surfaces warnings without gating the build.
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint, Type Check & Test
        # Turbo runs all three task types in parallel across packages.
        # --continue ensures all tasks run even if one fails early.
        run: pnpm exec turbo lint type-check test --continue

      - name: Build
        run: pnpm build
        env:
          JWT_SECRET: ci-build-jwt-secret-minimum-32-characters-long
