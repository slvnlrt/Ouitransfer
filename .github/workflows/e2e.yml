name: Release Validation

on:
  # Runs on version tags (pre-release) and manual trigger.
  # Builds Docker images, runs E2E + Lighthouse, then pushes images to GHCR.
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    name: E2E, Lighthouse & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # ── Build ──────────────────────────────────────────────────────────
      # docker compose build tags images using the `image:` field from the
      # compose file (ghcr.io/slvnlrt/ouitransfer-{server,web}:latest).
      # These same images are reused for testing AND publishing — no double build.
      - name: Build Docker images
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml build

      - name: Start Docker stack
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for server health..."
          timeout 120 bash -c 'until curl -fs http://localhost:3333/health; do sleep 2; done'
          echo "Waiting for web..."
          timeout 120 bash -c 'until curl -fs http://localhost:5487; do sleep 2; done'
          echo "All services healthy"

      # ── Test ───────────────────────────────────────────────────────────
      - name: Lighthouse CI
        run: pnpm lighthouse
        continue-on-error: true

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v

      # ── Publish (tag pushes only) ──────────────────────────────────────
      # Reuses the images already built above — just tag and push.
      # workflow_dispatch runs tests without publishing.
      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          for IMAGE in server web; do
            FULL="ghcr.io/${{ github.repository_owner }}/ouitransfer-${IMAGE}"

            # Semver tags (1.2.3 and 1.2)
            docker tag "${FULL}:latest" "${FULL}:${VERSION}"
            MINOR="${VERSION%.*}"
            docker tag "${FULL}:latest" "${FULL}:${MINOR}"

            docker push "${FULL}:latest"
            docker push "${FULL}:${VERSION}"
            docker push "${FULL}:${MINOR}"
          done
