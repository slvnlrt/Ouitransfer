name: E2E Tests

on:
  # Run before releases and on-demand — too heavy for every push/PR
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E & Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Build images locally and start the full stack with CI test credentials.
      # The CI overlay adds build directives and injects env vars that override
      # the empty REQUIRED placeholders in docker-compose.yaml.
      - name: Build and start Docker stack
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for server health..."
          timeout 120 bash -c 'until curl -fs http://localhost:3333/health; do sleep 2; done'
          echo "Waiting for web..."
          timeout 120 bash -c 'until curl -fs http://localhost:5487; do sleep 2; done'
          echo "All services healthy"

      # Lighthouse runs against the production Docker stack (port 5487).
      # Non-blocking: scores can vary under CI load.
      - name: Lighthouse CI
        run: pnpm lighthouse
        continue-on-error: true

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v
